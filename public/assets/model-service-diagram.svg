<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">PyGeoModel service workflow diagram</title>
  <desc id="desc">Notebook and Python API connected to OpenGMS model services with structured records.</desc>
  <rect width="760" height="460" rx="18" fill="#0f172a"/>
  <g opacity=".55">
    <path d="M0 106h760M0 226h760M0 346h760M160 0v460M380 0v460M600 0v460" stroke="#1f2937" stroke-width="1"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="54" y="70" width="210" height="116" rx="10" fill="#111827" stroke="#334155"/>
    <text x="78" y="108" fill="#e5e7eb" font-size="18" font-weight="700">Python workflow</text>
    <text x="78" y="138" fill="#94a3b8" font-size="14">search_models()</text>
    <text x="78" y="162" fill="#94a3b8" font-size="14">get_model()</text>
    <text x="78" y="186" fill="#94a3b8" font-size="14">invoke()</text>
